<text x="360" y="380" font-size="13" fill="#222">• Ronde opening Ø37 per fan, géén vierkant</text>
<text x="360" y="400" font-size="13" fill="#222">  40×40-gat: dan verdwijnen de hoekgaten</text>
<text x="360" y="420" font-size="13" fill="#222">  en valt de fan door de plaat.</text>
<text x="360" y="440" font-size="13" fill="#222">• 4 hoekgaten Ø4,5 (passend maken op de</text>
<text x="360" y="460" font-size="13" fill="#222">  meegeleverde siliconen pinnen).</text>
<text x="360" y="480" font-size="13" fill="#222">• Fan zit áchter de plaat, op een</text>
<text x="360" y="500" font-size="13" fill="#222">  afdichtingsring (foam/tochtband ±2 mm).</text>
<text x="360" y="520" font-size="13" fill="#222">• Tussen hoekgat en opening blijft ±2 mm</text>
<text x="360" y="540" font-size="13" fill="#222">  materiaal: stevig plaatmateriaal kiezen.</text>
<text x="360" y="560" font-size="13" fill="#222">• Geen schroeven direct in de fan.</text>
