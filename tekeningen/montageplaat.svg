<text x="80" y="278" font-size="12" fill="#222">9 × 40 + 8 × 5 + 2 × 10 = 420.  Fan 40 hoog, gecentreerd: 5 boven / 5 onder.  Stippellijn = buitenrand fan (zit achter de plaat).</text>
<text x="20" y="310" font-size="15" font-weight="bold" fill="#222">2. Detail per fan (schaal ≈ 6:1)</text>
